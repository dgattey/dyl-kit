# Written by `devkit sync` from DylKit. Change DylKit's copy, not this one.
name: release

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'server/**'
      - 'Tests/**'
      - '.github/**'
      - '.cursor/**'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Bump type; auto reads the Release info checkbox in the merge commit'
        required: false
        default: auto
        type: choice
        options: [auto, patch, minor, major]

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    # Job-level, so a PR closed without merging never queues behind a release.
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      site: ${{ steps.version.outputs.site }}
      assets: ${{ steps.version.outputs.assets }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          # Every tag plans the version, and build numbers count commits.
          fetch-depth: 0
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
      - uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-
      - name: Plan the version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TYPE: ${{ inputs.release_type || 'auto' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          ./run release version --type "$RELEASE_TYPE" ${PR_NUMBER:+--pr "$PR_NUMBER"} | tee -a "$GITHUB_OUTPUT"
      - name: Bundle
        run: ./run release bundle
      - name: Sign
        run: ./run release sign
      - name: Appcast
        env:
          SPARKLE_ED_PRIVATE_KEY_BASE64: ${{ secrets.SPARKLE_ED_PRIVATE_KEY_BASE64 }}
        run: ./run release appcast
      - name: Publish
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: ./run release publish

  # Waiting for the deploy is plain polling, so it runs on ubuntu instead of billing macOS minutes.
  live-site:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 17
    permissions: {}
    steps:
      - name: Wait for the site to serve the release and its icons
        env:
          SITE: ${{ needs.release.outputs.site }}
          ASSETS: ${{ needs.release.outputs.assets }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          same() { cmp -s <(curl -fsSL "$SITE/$1" || true) <(curl -fsSL "$ASSETS/icons/$2" || echo missing); }
          for _ in $(seq 60); do
            feed="$(curl -fsSL "$SITE/appcast.xml" || true)"
            page="$(curl -fsSL "$SITE" || true)"
            if grep -qF "<sparkle:shortVersionString>$VERSION<" <<<"$feed" && grep -qF "Version $VERSION" <<<"$page" &&
              same icon.png icon.png && same apple-touch-icon.png apple-touch-icon.png; then
              echo "$SITE serves $VERSION and its icons"
              exit 0
            fi
            sleep 15
          done
          echo "::error::$SITE didn't serve $VERSION, or the icons it uploaded, within 15 minutes"
          exit 1
