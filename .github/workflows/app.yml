# Each DylKit app's verify check and release. Apps call it from .github/workflows/dylkit.yml at the DylKit version they
# pin, on pull_request (opened, reopened, synchronize, closed) and workflow_dispatch, with contents: write and
# pull-requests: read, and `secrets: inherit`, which carries the app's SPARKLE_ED_PRIVATE_KEY_BASE64 and
# BLOB_READ_WRITE_TOKEN across repos. Never on `edited`: GitHub grades a commit by this workflow's newest run, so an
# edit's run, which has no verify, would replace verify's result. release-info.yml checks edits.
# Tests/Fixtures/SampleApp/.github/workflows/dylkit.yml is that caller.
name: app

on:
  workflow_call:
    inputs:
      release_type:
        description: 'Bump type; auto reads the Release info checkbox in the merge commit'
        required: false
        default: auto
        type: string
    secrets:
      SPARKLE_ED_PRIVATE_KEY_BASE64:
        required: false
      BLOB_READ_WRITE_TOKEN:
        required: false

jobs:
  # Which jobs a PR's files call for, judged on every file the PR changes, not the latest push alone, so a docs-only
  # push to a PR that touches code still verifies. A PR that only touches docs, the site or agent rules has nothing to
  # verify, and a merge to the default branch that only touches docs, the site, tests or CI ships no new app, so it
  # doesn't release.
  changes:
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' &&
        (contains(fromJSON('["opened", "reopened", "synchronize"]'), github.event.action) ||
          (github.event.pull_request.merged == true &&
            github.event.pull_request.base.ref == github.event.repository.default_branch)))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      verify: ${{ steps.files.outputs.verify }}
      release: ${{ steps.files.outputs.release }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
        run: |
          if [ -z "$PR_NUMBER" ]; then echo release=true >>"$GITHUB_OUTPUT"; exit 0; fi
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')"
          if [ "$ACTION" != closed ]; then
            if grep -qvE '(\.md$|^docs/|^server/|^\.cursor/)' <<<"$files"; then
              echo verify=true >>"$GITHUB_OUTPUT"
            else
              echo "Only docs, the site or agent rules changed; nothing to verify."
            fi
          elif grep -qvE '(\.md$|^docs/|^server/|^Tests/|^\.github/|^\.cursor/)' <<<"$files"; then
            echo release=true >>"$GITHUB_OUTPUT"
          else
            echo "Only docs, the site, tests or CI changed; nothing to release."
          fi

  # What a PR must pass: `devkit verify` on macOS runs the checks, builds, then runs all tests. It reports on every push
  # so a ruleset can require it, passing on ubuntu in seconds when there's nothing to verify, rather than skipping,
  # which a ruleset would wait on. It fails when `changes` couldn't tell.
  verify:
    needs: changes
    if: >-
      !cancelled() && github.event_name == 'pull_request' &&
        contains(fromJSON('["opened", "reopened", "synchronize"]'), github.event.action)
    concurrency:
      group: verify-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ${{ needs.changes.outputs.verify == 'true' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Nothing to verify
        if: needs.changes.outputs.verify != 'true'
        env:
          CHANGES: ${{ needs.changes.result }}
        run: |
          if [ "$CHANGES" != success ]; then
            echo "::error::The changes job ended $CHANGES, so nothing decided whether to verify."
            exit 1
          fi
          echo "Only docs, the site or agent rules changed; nothing to verify."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.verify == 'true'
      - name: Select Xcode
        if: needs.changes.outputs.verify == 'true'
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
      - uses: actions/cache@v6
        if: needs.changes.outputs.verify == 'true'
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-
      # The SwiftLint version the app's mise.toml pins, which `devkit checks` requires.
      - uses: jdx/mise-action@v5
        if: needs.changes.outputs.verify == 'true'
        with:
          install_args: swiftlint
      # The token reads the default branch's rules, which the checks compare with the workflows.
      - name: Verify
        if: needs.changes.outputs.verify == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: swift run devkit verify

  release:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    # Job-level, so a PR closed without merging never queues behind a release. GitHub keeps only the newest pending
    # run, so release-kit folds in merges whose runs this cancels.
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      site: ${{ steps.version.outputs.site }}
      assets: ${{ steps.version.outputs.assets }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          # Every tag plans the version, and build numbers count commits.
          fetch-depth: 0
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
      - uses: actions/cache@v6
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-
      - name: Plan the version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TYPE: ${{ inputs.release_type || 'auto' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          swift run release-kit version --type "$RELEASE_TYPE" ${PR_NUMBER:+--pr "$PR_NUMBER"} | tee -a "$GITHUB_OUTPUT"
      - name: Bundle
        run: swift run release-kit bundle
      - name: Sign
        run: swift run release-kit sign
      - name: Appcast
        env:
          SPARKLE_ED_PRIVATE_KEY_BASE64: ${{ secrets.SPARKLE_ED_PRIVATE_KEY_BASE64 }}
        run: swift run release-kit appcast
      - name: Publish
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: swift run release-kit publish

  # Waiting for the deploy is plain polling, so it runs on ubuntu instead of billing macOS minutes.
  live-site:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 17
    permissions: {}
    steps:
      - name: Wait for the site to serve the release and its icons
        env:
          SITE: ${{ needs.release.outputs.site }}
          ASSETS: ${{ needs.release.outputs.assets }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          same() { cmp -s <(curl -fsSL "$SITE/$1" || true) <(curl -fsSL "$ASSETS/icons/$2" || echo missing); }
          for _ in $(seq 60); do
            feed="$(curl -fsSL "$SITE/appcast.xml" || true)"
            page="$(curl -fsSL "$SITE" || true)"
            if grep -qF "<sparkle:shortVersionString>$VERSION<" <<<"$feed" && grep -qF "Version $VERSION" <<<"$page" &&
              same icon.png icon.png && same apple-touch-icon.png apple-touch-icon.png; then
              echo "$SITE serves $VERSION and its icons"
              exit 0
            fi
            sleep 15
          done
          echo "::error::$SITE didn't serve $VERSION, or the icons it uploaded, within 15 minutes"
          exit 1
