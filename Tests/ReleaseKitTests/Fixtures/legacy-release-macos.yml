# Build a signed macOS release, commit server/public/ for Vercel Git deploys, and publish a GitHub Release when PRs merge to main.
# Version bump type (major / minor / patch) is read from the merged PR's "# Release info" checkbox.
name: release-macos

on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'Sconeos.local.entitlements'
      - 'sparkle-public-key.txt'
      - 'scripts/build-macos.sh'
      - 'scripts/package-release.sh'
      - 'scripts/format-release-notes.sh'
      - 'scripts/cumulative-release-notes.sh'
      - 'scripts/fetch-release-notes-history.sh'
      - 'scripts/ci-build-macos-release.sh'
      - 'scripts/export-ci-secrets.sh'
      - 'scripts/fetch-live-macos-release.sh'
      - 'scripts/generate-icon.swift'
      - 'scripts/lib/signing.sh'
      - 'scripts/next-release-version.sh'
      - 'scripts/macos-release-inputs-changed.sh'
      - '.github/workflows/release-macos.yml'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release bump type (patch, minor, major)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer

      - name: Decide whether to rebuild the macOS app
        id: macos
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if ./scripts/macos-release-inputs-changed.sh; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve release type and notes from merged PR
        if: steps.macos.outputs.build == 'true'
        id: pr_meta
        uses: actions/github-script@v7
        env:
          INPUT_RELEASE_TYPE: ${{ inputs.release_type }}
        with:
          script: |
            const explicitType = (process.env.INPUT_RELEASE_TYPE || '').trim().toLowerCase();
            let prBody = '';
            let prNumber = '';
            let prTitle = '';
            try {
              const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
              });
              const mergedPr = pulls.find((p) => p.merged_at) || pulls[0];
              if (mergedPr) {
                prBody = mergedPr.body || '';
                prNumber = String(mergedPr.number);
                prTitle = (mergedPr.title || '').trim();
              }
            } catch (err) {
              core.warning(`Could not look up PR for commit ${context.sha}: ${err.message}`);
            }

            let releaseType = 'patch';
            if (explicitType === 'major' || explicitType === 'minor' || explicitType === 'patch') {
              releaseType = explicitType;
            } else if (/^\s*-\s*\[x\]\s*Major\b/im.test(prBody)) {
              releaseType = 'major';
            } else if (/^\s*-\s*\[x\]\s*Minor\b/im.test(prBody)) {
              releaseType = 'minor';
            }

            const escapeRegex = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const extractSection = (body, heading) => {
              const headingRe = new RegExp(`^#+\\s*${escapeRegex(heading)}\\s*$`, 'i');
              const anyHeadingRe = /^#+\s+\S/;
              const hrRe = /^-+\s*$/;
              let inSection = false;
              const collected = [];
              for (const line of body.split('\n')) {
                if (headingRe.test(line.trim())) {
                  inSection = true;
                  continue;
                }
                if (inSection) {
                  if (
                    anyHeadingRe.test(line.trim()) ||
                    hrRe.test(line.trim()) ||
                    line.includes('<!-- CURSOR_AGENT_PR_BODY_END -->')
                  ) {
                    break;
                  }
                  if (/^\s*[-*]\s*$/.test(line)) {
                    continue;
                  }
                  collected.push(line);
                }
              }
              return collected.join('\n').trim();
            };

            const extractNotes = (body, headings, fallbackTitle) => {
              for (const h of headings) {
                const section = extractSection(body, h);
                if (section) return section;
              }
              return fallbackTitle ? `- ${fallbackTitle}` : '';
            };

            const sparkleNotes = extractNotes(
              prBody,
              ['Release notes', 'Highlights', 'What changed?', 'Summary', 'Overview'],
              prTitle
            );
            const notes = extractNotes(
              prBody,
              ['What changed?', 'Release notes', 'Highlights', 'Summary', 'Overview'],
              prTitle
            );

            core.info(`Resolved release type: ${releaseType} (PR #${prNumber || 'none'})`);
            core.setOutput('release_type', releaseType);
            core.setOutput('pr_number', prNumber);
            core.setOutput('notes', notes);
            core.setOutput('sparkle_notes', sparkleNotes);

      - name: Build and package macOS release
        if: steps.macos.outputs.build == 'true'
        id: package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCONEOS_RELEASE_TYPE: ${{ steps.pr_meta.outputs.release_type }}
          SCONEOS_RELEASE_NOTES: ${{ steps.pr_meta.outputs.sparkle_notes }}
          SPARKLE_ED_PRIVATE_KEY_BASE64: ${{ secrets.SPARKLE_ED_PRIVATE_KEY_BASE64 }}
        run: ./scripts/ci-build-macos-release.sh

      - name: Commit and push release artifacts
        if: steps.macos.outputs.build == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add server/public/ VERSION
          if git diff --staged --quiet; then
            echo "release-macos: no changes to server/public — skipping commit"
            exit 0
          fi
          git commit -m "Release v${{ steps.package.outputs.version }}"
          git push

      - name: Create GitHub Release
        if: steps.macos.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.package.outputs.version }}
          NOTES: ${{ steps.pr_meta.outputs.notes }}
        run: |
          tag="v${VERSION}"
          notes="${NOTES:-Release ${tag}}"
          gh release create "$tag" \
            "server/public/Sconeos-${VERSION}.zip" \
            "server/public/appcast.xml" \
            --title "$tag" \
            --notes "$notes" \
            --target "${{ github.sha }}"
