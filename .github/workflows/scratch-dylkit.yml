name: dylkit

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, closed]
    branches: [dgattey/checks-base-ceba]

permissions:
  contents: write
  pull-requests: read

jobs:
  dylkit:
    uses: dgattey/dyl-kit/.github/workflows/app.yml@v0.7.0
    secrets: inherit
