# DylKit's own PRs run the apps' Release info check, through the same reusable workflow apps call.
name: pr-check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  release-info:
    uses: ./.github/workflows/app.yml
    with:
      verify: false
