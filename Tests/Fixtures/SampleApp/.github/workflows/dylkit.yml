name: dylkit

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, closed]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Bump type; auto reads the Release info checkbox in the merge commit'
        default: auto
        type: choice
        options: [auto, patch, minor, major]

permissions:
  contents: write
  pull-requests: read

jobs:
  dylkit:
    uses: dgattey/dyl-kit/.github/workflows/app.yml@v0.3.0
    with:
      release_type: ${{ inputs.release_type || 'auto' }}
    secrets:
      SPARKLE_ED_PRIVATE_KEY_BASE64: ${{ secrets.SPARKLE_ED_PRIVATE_KEY_BASE64 }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
