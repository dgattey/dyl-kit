name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'skills/**', '.cursor-plugin/**']
  pull_request:
    paths-ignore: ['**.md', 'skills/**', '.cursor-plugin/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swift:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
      - uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-
      - name: Build
        run: swift build
      # Sconeos's mise.toml pin, so the test that lints a scratch app through the shared config runs instead of skipping.
      - name: Install SwiftLint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
          unzip -q "$RUNNER_TEMP/swiftlint.zip" swiftlint -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
      - name: Test
        run: swift test
      - name: dyl-lint DylKit's own sources
        run: swift run dyl-lint Sources
      # Bundles, signs and checks SampleApp, the code a hand release on Dylan's Mac used to be the only test of. It
      # shares this job so a push holds one macOS runner, not two.
      - name: Release SampleApp with a throwaway key
        run: scripts/release-e2e.sh "$RUNNER_TEMP/sample"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test @dylkit/web
        run: npm ci --no-audit --no-fund && npm test

  # The shared files apps sync, plus DylKit's own workflows. actionlint runs shellcheck over every `run:` block.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint .github/workflows/*.yml Sources/ReleaseKit/Shared/*.yml
      - name: shellcheck ./run
        run: shellcheck Sources/ReleaseKit/Shared/run
