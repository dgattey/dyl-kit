name: release

# Apps' download sites install @dylkit/web from the tarball attached to the release for their DylKit tag.
on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the package versions
        run: |
          for manifest in web/package.json .cursor-plugin/plugin.json; do
            version="$(jq -r .version "$manifest")"
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::$manifest is $version, but the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done
      - name: Pack @dylkit/web
        working-directory: web
        run: npm pack
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" web/dylkit-web-*.tgz --title "$GITHUB_REF_NAME" --generate-notes
