name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'skills/**', '.cursor-plugin/**']
  pull_request:
    paths-ignore: ['**.md', 'skills/**', '.cursor-plugin/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swift:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
      - uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: dyl-lint DylKit's own sources
        run: swift run dyl-lint Sources
      # Bundles, signs and checks SampleApp, the code a hand release on Dylan's Mac used to be the only test of. It
      # shares this job so a push holds one macOS runner, not two.
      - name: Release SampleApp with a throwaway key
        run: scripts/release-e2e.sh "$RUNNER_TEMP/sample"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test @dylkit/web
        run: npm ci --no-audit --no-fund && npm test
