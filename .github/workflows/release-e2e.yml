name: release-e2e

# Bundles, signs and checks SampleApp, the code a hand release on Dylan's Mac used to be the only test of.
on:
  push:
    branches: [main]
    paths:
      - 'Sources/ReleaseKit/**'
      - 'Sources/release-kit/**'
      - 'Sources/DylManifest/**'
      - 'Sources/DylToolSupport/**'
      - 'Sources/DylUpdates/**'
      - 'Tests/Fixtures/SampleApp/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'scripts/release-e2e.sh'
      - '.github/workflows/release-e2e.yml'
  pull_request:
    paths:
      - 'Sources/ReleaseKit/**'
      - 'Sources/release-kit/**'
      - 'Sources/DylManifest/**'
      - 'Sources/DylToolSupport/**'
      - 'Sources/DylUpdates/**'
      - 'Tests/Fixtures/SampleApp/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'scripts/release-e2e.sh'
      - '.github/workflows/release-e2e.yml'

concurrency:
  group: release-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-e2e:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
      - uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-
      - name: Release SampleApp with a throwaway key
        run: scripts/release-e2e.sh "$RUNNER_TEMP/sample"
