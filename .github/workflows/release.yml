name: release

# DylKit releases like its apps, minus the app: a merged PR's Release info box picks the bump, release-kit tags it, and
# uploads the @dylkit/web tarball apps' download sites install to DylKit's Blob store. The tag is the only version;
# nothing is committed.
on:
  pull_request:
    types: [closed]
    branches: [main]
    paths-ignore: ['**.md', '.github/**', 'Tests/**']
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Bump type; auto reads the Release info checkbox in the merge commit'
        required: false
        default: auto
        type: choice
        options: [auto, patch, minor, major]

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    concurrency:
      group: release
      cancel-in-progress: false
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
      - uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-release-kit-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-release-kit-${{ runner.os }}-
      - name: Build release-kit
        run: swift build -c release --product release-kit -q
      - name: Plan the version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TYPE: ${{ inputs.release_type || 'auto' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          .build/release/release-kit library version --type "$RELEASE_TYPE" ${PR_NUMBER:+--pr "$PR_NUMBER"} |
            tee -a "$GITHUB_OUTPUT"
      - name: Pack @dylkit/web at the planned version
        working-directory: web
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm pack
      - name: Publish
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: .build/release/release-kit library publish "web/dylkit-web-$VERSION.tgz"
