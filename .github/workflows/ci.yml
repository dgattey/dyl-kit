name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'skills/**', '.cursor-plugin/**']
  pull_request:
    paths-ignore: ['**.md', 'skills/**', '.cursor-plugin/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swift:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
      - uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-
      - name: Build
        run: swift build
      # The SwiftLint apps pin, so the test that lints a scratch app through the shared config runs instead of skipping.
      - name: Install SwiftLint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
          unzip -q "$RUNNER_TEMP/swiftlint.zip" swiftlint -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
      - name: Test
        run: swift test
      - name: dyl-lint DylKit's own sources
        run: swift run dyl-lint Sources
      # Shares the swift job so a push holds one macOS runner.
      - name: Release SampleApp with a throwaway key
        run: scripts/release-e2e.sh "$RUNNER_TEMP/sample"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Test @dylkit/web
        run: pnpm install && pnpm test

  # DylKit's workflows, the reusable one apps call included, and SampleApp's copies of the files apps adopt once.
  # actionlint runs shellcheck over every `run:` block.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint .github/workflows/*.yml Tests/Fixtures/SampleApp/.github/workflows/*.yml
