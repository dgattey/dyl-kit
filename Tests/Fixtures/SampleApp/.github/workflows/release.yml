name: release

on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'DylApp.toml'
      - 'Sample.entitlements'
      - 'sparkle-public-key.txt'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Bump type; auto reads the merged PR''s Release info checkbox'
        required: false
        default: auto
        type: choice
        options: [auto, patch, minor, major]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
      - name: Fetch the merged PR's body
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ci/github/pr-body.sh "$GITHUB_SHA" "$RUNNER_TEMP/pr-body.md"
      - name: Plan the version
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -o pipefail
          ./run release version --type "${RELEASE_TYPE:-auto}" --pr-body-file "$RUNNER_TEMP/pr-body.md" \
            | tee -a "$GITHUB_OUTPUT"
      - name: Bundle
        run: ./run release bundle
      - name: Sign
        run: ./run release sign
      - name: Appcast
        env:
          SPARKLE_ED_PRIVATE_KEY_BASE64: ${{ secrets.SPARKLE_ED_PRIVATE_KEY_BASE64 }}
        run: ./run release appcast
      - name: Check
        run: ./run release check
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ./run release publish

  # Waiting for the deploy is plain polling, so it runs on ubuntu instead of billing macOS minutes.
  live-site:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 17
    permissions: {}
    steps:
      - name: Wait for the site to serve the release
        env:
          SITE: https://sample.example.com
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          for _ in $(seq 60); do
            feed="$(curl -fsSL "$SITE/appcast.xml" || true)"
            page="$(curl -fsSL "$SITE" || true)"
            if grep -qF "<sparkle:shortVersionString>$VERSION<" <<<"$feed" && grep -qF "Version $VERSION" <<<"$page"; then
              echo "$SITE serves $VERSION"
              exit 0
            fi
            sleep 15
          done
          echo "::error::$SITE didn't serve $VERSION within 15 minutes"
          exit 1
